<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f97316">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/marketpro-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pwa.js"></script>
  <title>Jeux | MarketPro</title>
  <style>
    .games-page{width:min(100% - 2rem,960px);margin:2rem auto}.games-hero{text-align:center;margin-bottom:2rem}.games-hero h1{color:#f97316;margin-bottom:.5rem}.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}.game-choice{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;background:#171717;border:1px solid #f97316;border-radius:20px;padding:1.5rem;box-shadow:0 12px 32px #0008;transition:transform .2s,background .2s}.game-choice:hover,.game-choice:focus-visible{transform:translateY(-4px);background:#242424}.game-icon{display:grid;place-items:center;width:88px;height:88px;border-radius:24px;background:#f97316;color:#111;font-size:2.5rem;margin-bottom:1rem}.game-choice h2{color:#f97316;margin:.25rem 0 .5rem}.game-choice p{margin:0 0 1.25rem;color:#ddd}.play-label{margin-top:auto;background:#f97316;color:#111;border-radius:10px;padding:.75rem 1.2rem;font-weight:800}@media(max-width:600px){.games-page{margin:1rem auto}.games-grid{grid-template-columns:1fr}.game-choice{padding:1.25rem}}
  </style>
</head>
<body>
  <header class="header"><div class="top-header"><div class="logo"><a href="index.html"><i class="fa-solid fa-store"></i> MarketPro</a></div><a href="index.html">Retour à la boutique</a></div></header>
  <main class="games-page">
    <section class="games-hero" aria-labelledby="games-title"><h1 id="games-title">Choisis ton jeu</h1><p>Sélectionne un jeu pour ouvrir sa page et commencer à jouer.</p></section>
    <section class="games-grid" aria-label="Jeux disponibles">
      <a class="game-choice" href="snake.html"><span class="game-icon" aria-hidden="true"><i class="fa-solid fa-worm"></i></span><h2>Snake MarketPro</h2><p>Mange les bonus et bats ton meilleur score.</p><span class="play-label">Jouer à Snake</span></a>
      <a class="game-choice" href="voiture.html"><span class="game-icon" aria-hidden="true">&#128663;</span><h2>Time Run</h2><p>Évite les voitures et reste sur la route le plus longtemps possible.</p><span class="play-label">Jouer à Time Run</span></a>
    </section>
  </main>
</body>
</html>
