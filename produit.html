<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produit | MarketPro</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="top-header">

            <div class="logo">
                <a href="index.html">
                    <i class="fa-solid fa-store"></i> MarketPro
                </a>
            </div>

            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="vendre.html">Vendre</a></li>
                    <li><a href="publier.html">Publier</a></li>
                    <li><a class="active" href="produit.html">Produit</a></li>
                    <li><a href="likes.html">Likes</a></li>
                    <li><a href="info.html">Info</a></li>
                </ul>
            </nav>

        </div>

    </header>

    <!-- PRODUIT DETAIL -->

    <section class="product-detail">

        <!-- JS injectera ici -->

        <div class="loading">
            <h2>Chargement du produit...</h2>
        </div>

    </section>
        <!-- SCRIPT JS -->

    <script src="js/app.js"></script>

    <!-- STYLE PRODUIT -->

    <style>

        .product-detail {
            padding: 50px;
            max-width: 900px;
            margin: auto;
        }

        .detail-box {
            display: flex;
            gap: 30px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            animation: fadeUp 0.5s ease;
        }

        .detail-box img {
            width: 300px;
            border-radius: 15px;
            object-fit: cover;
        }

        .detail-info h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 22px;
            color: #00c3ff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .comment-section {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .comment-section input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .comment-section button {
            padding: 10px 15px;
            border: none;
            background: #111;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        .comment-list {
            margin-top: 15px;
        }

        .comment-list p {
            background: #f4f4f4;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 5px;
        }

    </style>

</body>
</html>
