<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion | MarketPro</title><link rel="stylesheet" href="css/style.css"><style>.auth{max-width:460px;margin:90px auto;padding:32px;background:#fff;border-radius:20px;box-shadow:0 8px 28px #1111}.auth form{display:grid;gap:14px}.auth input,.auth button{padding:13px;border:1px solid #ddd;border-radius:10px}.auth button{background:#111;color:#fff;cursor:pointer}.auth button:hover{background:#00a9dc}.error{color:#b42318;min-height:20px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth"><a href="index.html">← MarketPro</a><h1 style="margin:24px 0 8px">Connexion</h1><p>Accédez à votre compte ou à l’administration.</p><form id="login"><input id="email" type="email" placeholder="Votre email" required><input id="password" type="password" placeholder="Mot de passe" required minlength="6"><button>Se connecter</button><p class="error" id="error"></p></form></main><script type="module">import {getSupabase} from './js/supabase.js';const form=document.querySelector('#login'),error=document.querySelector('#error');form.onsubmit=async(e)=>{e.preventDefault();error.textContent='';try{const s=await getSupabase();const {error:authError}=await s.auth.signInWithPassword({email:email.value,password:password.value});if(authError)throw authError;location.href=new URLSearchParams(location.search).get('next')||'index.html'}catch(e){error.textContent='Email ou mot de passe incorrect.';console.error('[v0] login error',e)}};</script></body></html>
